name: pytest

on:
  # PR branches run via pull_request only (push + pull_request ran everything twice)
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (locked, hashed, wheels only)
        run: pip install --require-hashes --only-binary :all: -r requirements-ci.txt
      - name: Lint
        run: ruff check src tests scripts/e2e_dashboard.py
      - name: Run tests
        run: pytest -q

  dashboard-e2e:
    # Browser check of the live panel (web mode + a fake MCP Apps host).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (locked, hashed, wheels only)
        run: |
          pip install --require-hashes --only-binary :all: -r requirements-e2e.txt
          python -m playwright install --with-deps chromium
      - name: E2E
        env:
          PYTHONPATH: src
        run: python scripts/e2e_dashboard.py
